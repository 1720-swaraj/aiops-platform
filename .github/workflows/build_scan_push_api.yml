name: Build, Scan and Push Api

on:
  push:
    branches: [ main ]
    paths:
      - 'app/api/**'
      - '.github/workflows/build_scan_push_api.yml'
    workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_scan_push:
    runs-on: ubuntu:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build docker image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aiops-api"
          echo "$IMAGE"
