name: Build, Scan and Push Api

on:
  push:
    branches: [ main ]
    paths:
      - 'app/api/**'
      - '.github/workflows/build_scan_push_api.yml'
    workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_scan_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build docker image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aiops-api"
          echo "this is : $IMAGE"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" ./app/api

      - name: Scan Image with Trivy
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aiops-api:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "$IMAGE"

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Image to ghcr
        run: |
          echo "${{ github.actor }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/aiops-api"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"    
